basePath: /api/v1
definitions:
  clients.User:
    properties:
      email:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      role:
        type: string
    type: object
  helpers.Meta:
    properties:
      page:
        type: integer
      page_size:
        type: integer
      total_count:
        type: integer
      total_pages:
        type: integer
    type: object
  helpers.Response:
    properties:
      data: {}
      error: {}
      message:
        type: string
      meta:
        $ref: '#/definitions/helpers.Meta'
      success:
        type: boolean
    type: object
  models.Booking:
    properties:
      created_at:
        type: string
      id:
        type: string
      notes:
        type: string
      scheduled_at:
        type: string
      service_name:
        type: string
      status:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  routes.healthResponse:
    properties:
      database:
        example: ok
        type: string
      env:
        example: dev
        type: string
      status:
        example: ok
        type: string
    type: object
  services.CreateBookingInput:
    properties:
      notes:
        example: Leaky faucet
        type: string
      scheduled_at:
        example: "2026-08-20T10:00:00Z"
        type: string
      service_name:
        example: Plumbing repair
        type: string
    required:
    - scheduled_at
    - service_name
    type: object
host: localhost:8080
info:
  contact:
    email: mohit.chack@rosstechnologies.in
    name: API Support
  description: Owns bookings (Postgres via GORM). Resolves user_id against the User
    Service over HTTP before reading/writing a booking.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  title: HelpMe Booking Service API
  version: "1.0"
paths:
  /bookings:
    get:
      description: Looks up the owning user via the User Service, then lists their
        bookings from Postgres
      parameters:
      - description: User UUID
        in: query
        name: user_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/helpers.Response'
            - properties:
                data:
                  properties:
                    bookings:
                      items:
                        $ref: '#/definitions/models.Booking'
                      type: array
                    meta:
                      $ref: '#/definitions/helpers.Meta'
                    user:
                      $ref: '#/definitions/clients.User'
                  type: object
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/helpers.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/helpers.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/helpers.Response'
      security:
      - BearerAuth: []
      summary: List bookings
      tags:
      - Bookings
    post:
      consumes:
      - application/json
      description: Creates a booking for a user, after verifying the user exists via
        the User Service
      parameters:
      - description: User UUID
        in: query
        name: user_id
        required: true
        type: string
      - description: Booking payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/services.CreateBookingInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/helpers.Response'
            - properties:
                data:
                  $ref: '#/definitions/models.Booking'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/helpers.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/helpers.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/helpers.Response'
      security:
      - BearerAuth: []
      summary: Create a booking
      tags:
      - Bookings
  /health:
    get:
      description: Returns service liveness and database connectivity status
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/routes.healthResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/routes.healthResponse'
      summary: Health check
      tags:
      - Health
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and your JWT token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
